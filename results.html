<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live costume results — Basecamp Beats</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: 'Poppins', system-ui, sans-serif;
      color: #fff;
      background: #080301;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -8%, rgba(255, 140, 40, 0.32), transparent 55%),
        radial-gradient(ellipse 50% 40% at 100% 80%, rgba(194, 65, 45, 0.16), transparent 50%);
      pointer-events: none;
    }
    .wrap { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; padding: 16px 16px 56px; }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
    }
    a { color: rgba(255,255,255,0.55); font-weight: 600; text-decoration: none; font-size: 0.9rem; }
    a:hover { color: #e8c07a; }
    .kicker {
      display: block;
      text-align: center;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #e8c07a;
      margin-bottom: 8px;
    }
    h1 {
      font-size: clamp(1.7rem, 6vw, 2.5rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      text-align: center;
      color: #fff;
      line-height: 1.1;
    }
    .totals {
      text-align: center;
      color: rgba(255,255,255,0.62);
      margin: 8px 0 22px;
      font-weight: 600;
    }
    .lead {
      position: relative;
      border-radius: 22px;
      overflow: hidden;
      margin-bottom: 16px;
      border: 1px solid rgba(232, 192, 122, 0.5);
      background: #120804;
      cursor: pointer;
    }
    .lead img {
      width: 100%;
      aspect-ratio: 4 / 5;
      max-height: 38vh;
      object-fit: cover;
      background: #0a0503;
      display: block;
    }
    .lead-meta { padding: 16px 16px 18px; }
    .tie-banner {
      text-align: center;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #140804;
      background: linear-gradient(135deg, #ffb36a, #e8c07a);
      border-radius: 999px;
      padding: 7px 14px;
      margin: 0 auto 12px;
      width: fit-content;
    }
    .co-leads {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }
    .co-leads .card { border-color: rgba(232, 192, 122, 0.55); }
    .rank-tie { color: rgba(255,255,255,0.5); font-weight: 700; }
    .rank {
      font-weight: 800;
      color: #e8c07a;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .name { font-weight: 800; font-size: 1.3rem; letter-spacing: -0.03em; }
    .bar-wrap {
      height: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 99px;
      overflow: hidden;
      margin: 10px 0 6px;
    }
    .bar {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, #ff7a2e, #e8c07a);
    }
    .count { font-size: 0.9rem; color: rgba(255,255,255,0.7); }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media (min-width: 640px) {
      .grid { grid-template-columns: repeat(3, 1fr); gap: 14px; }
    }
    .card {
      background: #120804;
      border: 1px solid rgba(255,179,106,0.22);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
    }
    .card img {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      display: block;
      background: #0a0503;
    }
    .card .pad { padding: 10px 10px 12px; }
    .card .name { font-size: 0.95rem; line-height: 1.25; }
    .card .count { font-size: 0.8rem; }
    .card .bar-wrap { height: 6px; margin: 8px 0 4px; }
    .empty { text-align: center; padding: 40px; color: rgba(255,255,255,0.6); }
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 20;
      background: rgba(0,0,0,0.94);
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 16px;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 96%;
      max-height: 94vh;
      object-fit: contain;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <a href="/vote.html">← Vote</a>
      <a href="/">Home</a>
    </div>
    <span class="kicker">Costume competition</span>
    <h1>Live results</h1>
    <p class="totals" id="totals">Waiting for votes…</p>
    <div id="board"></div>
  </div>
  <div class="lightbox" id="lightbox"><img id="lightboxImg" alt=""></div>
  <script>
    const API = 'https://bb-costume-vote.beatsbasecamp.workers.dev';
    const EVENT_ID = 'halloween-2026';
    const board = document.getElementById('board');
    const totals = document.getElementById('totals');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');

    function srcOf(e) {
      const path = e.url || e.thumbUrl || '';
      return path.startsWith('http') ? path : API + path;
    }

    function resultsUrl() {
      const u = new URL('/results', API);
      u.searchParams.set('event', EVENT_ID);
      return u.toString();
    }

    lightbox.addEventListener('click', () => lightbox.classList.remove('open'));

    function openPhoto(src) {
      lightboxImg.src = src;
      lightbox.classList.add('open');
    }

    async function refresh() {
      try {
        const res = await fetch(resultsUrl(), { credentials: 'include' });
        const data = await res.json();
        const entries = data.entries || [];
        const total = data.totalVotes || 0;
        totals.textContent = total ? `${total} vote${total === 1 ? '' : 's'} in` : 'No votes yet';
        if (!entries.length) {
          board.innerHTML = '<div class="empty">Finalists will show here once staff uploads the looks.</div>';
          return;
        }
        const max = Math.max(1, ...entries.map((e) => e.votes));
        const countOf = new Map();
        entries.forEach((e) => countOf.set(e.votes, (countOf.get(e.votes) || 0) + 1));
        let rank = 0;
        entries.forEach((e, i) => {
          if (i === 0 || e.votes !== entries[i - 1].votes) rank = i + 1;
          e.rank = rank;
          e.tied = countOf.get(e.votes) > 1;
        });

        const votesText = (n) => `${n} vote${n === 1 ? '' : 's'}`;
        const rankLabel = (e) => e.tied
          ? `T-${e.rank} <span class="rank-tie">· tied</span>`
          : `#${e.rank}`;
        const card = (e, label) => {
          const src = srcOf(e);
          const pct = Math.round((e.votes / max) * 100);
          return `<article class="card" data-src="${src}">
            <img src="${src}" alt="${e.name}">
            <div class="pad">
              <div class="rank">${label}</div>
              <div class="name">${e.name}</div>
              <div class="bar-wrap"><div class="bar" style="width:${pct}%"></div></div>
              <div class="count">${votesText(e.votes)}</div>
            </div>
          </article>`;
        };

        const leaders = entries.filter((e) => e.rank === 1);
        const rest = entries.filter((e) => e.rank !== 1);
        let leadHtml;
        if (!total) {
          leadHtml = '';
        } else if (leaders.length === 1) {
          const lead = leaders[0];
          const leadSrc = srcOf(lead);
          leadHtml = `<article class="lead" data-src="${leadSrc}">
            <img src="${leadSrc}" alt="${lead.name}">
            <div class="lead-meta">
              <div class="rank">Leading</div>
              <div class="name">${lead.name}</div>
              <div class="bar-wrap"><div class="bar" style="width:100%"></div></div>
              <div class="count">${votesText(lead.votes)}</div>
            </div>
          </article>`;
        } else {
          leadHtml = `<div class="tie-banner">${leaders.length}-way tie for the lead</div>
            <div class="co-leads">${leaders.map((e) => card(e, 'Tied for 1st')).join('')}</div>`;
        }
        const others = total ? rest : entries;
        const restHtml = others.length
          ? `<div class="grid">${others.map((e) => card(e, total ? rankLabel(e) : 'No votes yet')).join('')}</div>`
          : '';
        board.innerHTML = leadHtml + restHtml;
        board.querySelectorAll('[data-src]').forEach((el) => {
          el.addEventListener('click', () => openPhoto(el.dataset.src));
        });
      } catch (_) {
        totals.textContent = 'Could not reach the vote board';
      }
    }
    refresh();
    setInterval(refresh, 4000);
  </script>
</body>
</html>
