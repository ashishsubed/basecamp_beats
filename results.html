<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live costume results — Basecamp Beats</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: 'Poppins', system-ui, sans-serif;
      color: #fff;
      background: #050201;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 55% at 50% -10%, rgba(255, 140, 40, 0.22), transparent 55%),
        radial-gradient(ellipse 50% 40% at 90% 90%, rgba(194, 65, 45, 0.1), transparent 50%);
      pointer-events: none;
    }
    .wrap { position: relative; z-index: 1; max-width: 980px; margin: 0 auto; padding: 20px 16px 48px; }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    a { color: #e8c07a; font-weight: 700; text-decoration: none; }
    h1 {
      font-family: 'Cinzel', serif;
      text-align: center;
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      background: linear-gradient(135deg, #ffb36a, #ff7a2e);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .totals {
      text-align: center;
      color: rgba(255,255,255,0.65);
      margin: 6px 0 22px;
      font-weight: 600;
    }
    .lead {
      position: relative;
      border-radius: 22px;
      overflow: hidden;
      margin-bottom: 22px;
      border: 1px solid rgba(232, 192, 122, 0.45);
      background: #120804;
      cursor: pointer;
    }
    .lead img {
      width: 100%;
      height: min(72vh, 620px);
      object-fit: contain;
      background: #0a0503;
      display: block;
    }
    .lead-meta {
      padding: 16px 18px 18px;
    }
    .rank {
      font-weight: 800;
      color: #e8c07a;
      font-size: 0.82rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .name { font-weight: 800; font-size: 1.35rem; }
    .bar-wrap {
      height: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 99px;
      overflow: hidden;
      margin: 10px 0 6px;
    }
    .bar {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, #ff7a2e, #e8c07a);
    }
    .count { font-size: 0.9rem; color: rgba(255,255,255,0.7); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 14px;
    }
    .card {
      background: #120804;
      border: 1px solid rgba(255,122,46,0.25);
      border-radius: 18px;
      overflow: hidden;
      cursor: pointer;
    }
    .card img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      display: block;
      background: #0a0503;
    }
    .card .pad { padding: 12px 14px 14px; }
    .empty { text-align: center; padding: 40px; color: rgba(255,255,255,0.6); }
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 20;
      background: rgba(0,0,0,0.94);
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 16px;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 96%;
      max-height: 94vh;
      object-fit: contain;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <a href="/vote.html">← Vote</a>
      <a href="/">Home</a>
    </div>
    <h1>Live results</h1>
    <p class="totals" id="totals">Waiting for votes…</p>
    <div id="board"></div>
  </div>
  <div class="lightbox" id="lightbox"><img id="lightboxImg" alt=""></div>
  <script>
    const API = 'https://bb-costume-vote.beatsbasecamp.workers.dev';
    const EVENT_ID = 'halloween-2026';
    const board = document.getElementById('board');
    const totals = document.getElementById('totals');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');

    function srcOf(e) {
      const path = e.url || e.thumbUrl || '';
      return path.startsWith('http') ? path : API + path;
    }

    function resultsUrl() {
      const u = new URL('/results', API);
      u.searchParams.set('event', EVENT_ID);
      return u.toString();
    }

    lightbox.addEventListener('click', () => lightbox.classList.remove('open'));

    function openPhoto(src) {
      lightboxImg.src = src;
      lightbox.classList.add('open');
    }

    async function refresh() {
      try {
        const res = await fetch(resultsUrl(), { credentials: 'include' });
        const data = await res.json();
        const entries = data.entries || [];
        const total = data.totalVotes || 0;
        totals.textContent = total ? `${total} vote${total === 1 ? '' : 's'} in` : 'No votes yet';
        if (!entries.length) {
          board.innerHTML = '<div class="empty">Finalists will show here once staff uploads the looks.</div>';
          return;
        }
        const max = Math.max(1, ...entries.map((e) => e.votes));
        const [lead, ...rest] = entries;
        const leadSrc = srcOf(lead);
        const leadPct = Math.round((lead.votes / max) * 100);
        const leadHtml = `<article class="lead" data-src="${leadSrc}">
            <img src="${leadSrc}" alt="${lead.name}">
            <div class="lead-meta">
              <div class="rank">${lead.votes ? 'Leading' : '#' + 1}</div>
              <div class="name">${lead.name}</div>
              <div class="bar-wrap"><div class="bar" style="width:${leadPct}%"></div></div>
              <div class="count">${lead.votes} vote${lead.votes === 1 ? '' : 's'}</div>
            </div>
          </article>`;
        const restHtml = rest.length ? `<div class="grid">${rest.map((e, i) => {
          const src = srcOf(e);
          const pct = Math.round((e.votes / max) * 100);
          return `<article class="card" data-src="${src}">
            <img src="${src}" alt="${e.name}">
            <div class="pad">
              <div class="rank">#${i + 2}</div>
              <div class="name">${e.name}</div>
              <div class="bar-wrap"><div class="bar" style="width:${pct}%"></div></div>
              <div class="count">${e.votes} vote${e.votes === 1 ? '' : 's'}</div>
            </div>
          </article>`;
        }).join('')}</div>` : '';
        board.innerHTML = leadHtml + restHtml;
        board.querySelectorAll('[data-src]').forEach((el) => {
          el.addEventListener('click', () => openPhoto(el.dataset.src));
        });
      } catch (_) {
        totals.textContent = 'Could not reach the vote board';
      }
    }
    refresh();
    setInterval(refresh, 4000);
  </script>
</body>
</html>
