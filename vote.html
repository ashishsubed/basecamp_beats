<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vote costumes — Basecamp Beats</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: 'Poppins', system-ui, sans-serif;
      color: #fff;
      background: #080301;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -8%, rgba(255, 140, 40, 0.32), transparent 55%),
        radial-gradient(ellipse 50% 40% at 100% 80%, rgba(194, 65, 45, 0.16), transparent 50%);
      pointer-events: none;
    }
    .wrap { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; padding: 16px 16px 56px; }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
    }
    .back { color: rgba(255,255,255,0.55); text-decoration: none; font-weight: 600; font-size: 0.9rem; }
    .back:hover { color: #e8c07a; }
    .results-link {
      color: #140804;
      background: linear-gradient(135deg, #ffb36a, #ff7a2e);
      text-decoration: none;
      font-weight: 800;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.84rem;
    }
    .kicker {
      display: block;
      text-align: center;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #e8c07a;
      margin-bottom: 8px;
    }
    h1 {
      font-size: clamp(1.7rem, 6vw, 2.5rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      text-align: center;
      color: #fff;
      line-height: 1.1;
    }
    .lede {
      text-align: center;
      color: rgba(255,255,255,0.68);
      max-width: 360px;
      margin: 10px auto 8px;
      line-height: 1.5;
      font-size: 0.98rem;
    }
    .prize {
      text-align: center;
      color: #ffb36a;
      font-weight: 700;
      font-size: 0.92rem;
      margin-bottom: 18px;
    }
    .status {
      text-align: center;
      min-height: 1.3em;
      margin-bottom: 16px;
      font-weight: 600;
      font-size: 0.92rem;
      color: #e8c07a;
    }
    .status.err { color: #f87171; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media (min-width: 640px) {
      .grid { grid-template-columns: repeat(3, 1fr); gap: 14px; }
    }
    .card {
      background: #120804;
      border: 1px solid rgba(255, 179, 106, 0.22);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .card.is-mine {
      border-color: #e8c07a;
      box-shadow: 0 0 0 2px rgba(232, 192, 122, 0.45);
    }
    .card img {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      display: block;
      cursor: pointer;
      background: #1a0c06;
    }
    .meta {
      padding: 10px 10px 12px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .name {
      font-weight: 800;
      font-size: 0.95rem;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
      line-height: 1.25;
      flex: 1;
    }
    .vote-btn {
      width: 100%;
      border: none;
      border-radius: 999px;
      padding: 10px 8px;
      font-family: inherit;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      background: linear-gradient(135deg, #ff8a3d, #c2412d);
      color: #fff;
    }
    .vote-btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .vote-btn.is-mine {
      background: linear-gradient(135deg, #e8c07a, #ffb36a);
      color: #140804;
    }
    .empty, .loading {
      text-align: center;
      padding: 48px 16px;
      color: rgba(255,255,255,0.65);
    }
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 20;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 92%; max-height: 90vh; border-radius: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <a class="back" href="/">← Home</a>
      <a class="results-link" href="/results.html">Live results</a>
    </div>
    <span class="kicker">Costume competition</span>
    <h1>Vote costumes</h1>
    <p class="lede">Tap the look you want to win.</p>
    <p class="prize">$100 + trophy</p>
    <div class="status" id="status"></div>
    <div id="grid" class="loading">Loading looks…</div>
  </div>
  <div class="lightbox" id="lightbox"><img id="lightboxImg" alt=""></div>
  <script src="https://openfpcdn.io/fingerprintjs/v4/iife.min.js"></script>
  <script>
    const API = 'https://bb-costume-vote.beatsbasecamp.workers.dev';
    const EVENT_ID = 'halloween-2026';
    const grid = document.getElementById('grid');
    const statusEl = document.getElementById('status');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    let visitorId = '';
    let votedFor = null;
    let orderKeys = null;

    function shuffle(list) {
      const a = list.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function ordered(entries) {
      if (!orderKeys) {
        orderKeys = shuffle(entries).map((e) => e.key);
      }
      const byKey = new Map(entries.map((e) => [e.key, e]));
      const known = orderKeys.map((k) => byKey.get(k)).filter(Boolean);
      const extra = entries.filter((e) => !orderKeys.includes(e.key));
      if (extra.length) {
        const extraShuffled = shuffle(extra);
        extraShuffled.forEach((e) => orderKeys.push(e.key));
        return known.concat(extraShuffled);
      }
      return known;
    }

    async function ensureVisitor() {
      if (visitorId) return visitorId;
      try {
        if (typeof FingerprintJS !== 'undefined') {
          const fp = await Promise.race([
            FingerprintJS.load().then((agent) => agent.get()),
            new Promise((_, reject) => setTimeout(() => reject(new Error('fingerprint timeout')), 4000)),
          ]);
          if (fp && fp.visitorId) {
            visitorId = fp.visitorId;
            return visitorId;
          }
        }
      } catch (_) {}
      visitorId = 'fb_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      return visitorId;
    }

    function voterHeader() {
      return { 'X-Visitor-Id': visitorId };
    }

    function setStatus(msg, err) {
      statusEl.textContent = msg || '';
      statusEl.className = 'status' + (err ? ' err' : '');
    }

    lightbox.addEventListener('click', () => lightbox.classList.remove('open'));

    async function api(path, opts = {}) {
      const u = new URL(path, API);
      u.searchParams.set('event', EVENT_ID);
      const res = await fetch(u.toString(), {
        credentials: 'include',
        ...opts,
        headers: { ...voterHeader(), ...(opts.headers || {}) },
      });
      let data = {};
      try { data = await res.json(); } catch (_) {}
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    }

    function render(entries) {
      const list = ordered(entries);
      if (!list.length) {
        grid.className = 'empty';
        grid.textContent = 'Finalists will appear here after the walk show.';
        return;
      }
      grid.className = 'grid';
      grid.innerHTML = '';
      list.forEach((e) => {
        const mine = votedFor === e.key;
        const card = document.createElement('article');
        card.className = 'card' + (mine ? ' is-mine' : '');
        const src = (e.thumbUrl || e.url).startsWith('http') ? (e.thumbUrl || e.url) : API + (e.thumbUrl || e.url);
        const full = e.url.startsWith('http') ? e.url : API + e.url;
        card.innerHTML = `
          <img src="${src}" alt="${e.name}" loading="lazy" decoding="async">
          <div class="meta">
            <div class="name">${mine ? '★ ' : ''}${e.name}</div>
            <button class="vote-btn${mine ? ' is-mine' : ''}" type="button">${mine ? 'Your vote' : 'Vote'}</button>
          </div>`;
        card.querySelector('img').addEventListener('click', () => {
          lightboxImg.src = full;
          lightbox.classList.add('open');
        });
        card.querySelector('button').addEventListener('click', () => vote(e.key));
        grid.appendChild(card);
      });
    }

    async function vote(key) {
      setStatus('Counting…');
      try {
        await ensureVisitor();
        const data = await api('/vote', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...voterHeader() },
          body: JSON.stringify({ key }),
        });
        votedFor = data.votedFor;
        setStatus(data.message || 'Vote counted.');
        const list = await api('/entries');
        render(list.entries || []);
      } catch (err) {
        setStatus(err.message, true);
      }
    }

    async function showLooks() {
      const list = await api('/entries');
      render(list.entries || []);
      if (votedFor) setStatus('You already picked a look. Tap another to switch.');
    }

    async function boot() {
      try {
        await showLooks();
      } catch (err) {
        grid.className = 'empty';
        grid.textContent = 'Could not load the contest. Try again in a moment.';
        setStatus(err.message, true);
        return;
      }
      try {
        await ensureVisitor();
        const me = await api('/me');
        votedFor = me.votedFor;
        if (votedFor) {
          const list = await api('/entries');
          render(list.entries || []);
          setStatus('You already picked a look. Tap another to switch.');
        }
      } catch (_) {}
    }
    boot();
  </script>
</body>
</html>
